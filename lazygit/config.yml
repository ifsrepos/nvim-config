git:
  diffRenderers:
    - type: extDiff
      command: difft --color=always --background={{colorScheme}} --width={{width}} --context={{diffContext}}
os:
  editPreset: nvim-remote
customCommands:
  - key: 'X'
    command: 'nvim -c "DiffviewOpen {{.SelectedLocalCommit.Hash}}^!"'
    context: 'commits'
    output: terminal
  - key: 'X'
    command: 'nvim -c "DiffviewOpen"'
    context: 'files'
    output: terminal
