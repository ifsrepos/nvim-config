git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never
os:
  editPreset: nvim-remote
customCommands:
  - key: 'X'
    command: 'nvim -c "DiffviewOpen {{.SelectedLocalCommit.Hash}}^!"'
    context: 'commits'
    subprocess: true
  - key: 'X'
    command: 'nvim -c "DiffviewOpen"'
    context: 'files'
    subprocess: true
